services:
  database:
    image: postgres:15-alpine
    container_name: participation_tracker_db
    environment:
      POSTGRES_USER: tracker_user
      POSTGRES_PASSWORD: jdETkY08Gw0Y4gTQ
      POSTGRES_DB: participation_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: participation_tracker_redis
    ports:
      - "6379:6379"
    restart: unless-stopped


  app:
    build: .
    container_name: participation_tracker_app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: "http://hsapp.yungu.org/participation"  # Must match nginx location
      AUTH_URL: "http://hsapp.yungu.org/participation"       # Must match nginx location
      NEXTAUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: "/pGUGH4pKt0wtPYwNRxsdw1NOUY+oIm7oRyQM4/yeBml7fo7FRz2z4zRrc8HbVE2"
      DATABASE_URL: "postgresql://tracker_user:jdETkY08Gw0Y4gTQ@database:5432/participation_tracker?connect_timeout=15"
      REDIS_URL: "redis://redis:6379/0"         # << add this
    ports:
      - "3010:3000"
    # Force non-standalone runtime:
    command: ["node", "node_modules/next/dist/bin/next", "start", "-p", "3000"]
    restart: unless-stopped

volumes:
  postgres_data:
